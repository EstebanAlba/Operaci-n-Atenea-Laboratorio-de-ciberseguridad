# Laboratorio aislado - Operacion Atenea (Fase 2)
# Todos los servicios y datos son ficticios.
name: atenea-lab

services:
  portal:                       # PORTAL-01 - portal de colaboracion
    build: ./portal
    container_name: atenea-portal
    volumes:
      - ./evidencias/fase4:/registros     # registro de accesos del portal (fase 4)
    networks:
      lab:
        ipv4_address: 192.168.56.10

  repositorio:                  # REPO-01 - repositorio de proyectos (HTTP)
    image: nginx:1.24.0-alpine
    container_name: atenea-repositorio
    volumes:
      - ./repositorio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./repositorio/archivos:/usr/share/nginx/html:ro
    networks:
      lab:
        ipv4_address: 192.168.56.11

  repositorio-ssh:              # REPO-01 - acceso administrativo por SSH
    build: ./repositorio-ssh
    container_name: atenea-repositorio-ssh
    network_mode: "service:repositorio"   # comparte la IP 192.168.56.11
    volumes:
      - ./repositorio-ssh/sshd_config.inicial:/etc/ssh/sshd_config:ro
    depends_on:
      - repositorio

  auditor:                      # Equipo auditor con Nmap
    build: ./auditor
    container_name: atenea-auditor
    volumes:
      - ./evidencias:/evidencias
      - ./herramientas:/herramientas:ro
    networks:
      lab:
        ipv4_address: 192.168.56.12

networks:
  lab:
    driver: bridge
    internal: true              # sin salida a internet ni a la red de la casa
    ipam:
      config:
        - subnet: 192.168.56.0/24

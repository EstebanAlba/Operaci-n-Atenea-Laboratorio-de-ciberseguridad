# Aplica el plan de cierre sin borrar servicios:
#   docker compose -f docker-compose.yml -f docker-compose.cierre.yml up -d
services:
  repositorio:
    volumes:
      - ./repositorio/nginx.cierre.conf:/etc/nginx/conf.d/default.conf:ro
  repositorio-ssh:
    volumes:
      - ./repositorio-ssh/sshd_config.cierre:/etc/ssh/sshd_config:ro

# REPO-01 - configuracion inicial (antes del plan de cierre)
server {
    listen 80;
    server_name repositorio.atenea.lab;

    server_tokens on;          # anuncia la version de nginx en cada respuesta

    location / {
        root /usr/share/nginx/html;
        autoindex on;          # lista el contenido de las carpetas
    }
}

# REPO-01 - configuracion despues del plan de cierre
server {
    listen 80;
    server_name repositorio.atenea.lab;

    server_tokens off;         # deja de anunciar la version

    location / {
        root /usr/share/nginx/html;
        autoindex off;         # sin listado de carpetas: hay que conocer la ruta exacta
    }
}
